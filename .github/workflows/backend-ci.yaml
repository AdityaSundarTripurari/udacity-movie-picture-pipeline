# .github/workflows/backend-ci.yaml

name: Backend Continuous Integration

# ---- TRIGGERS ----
on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  # CRITICAL RUBRIC REQUIREMENT: allows manually running this from the
  # "Actions" tab on GitHub, via the "Run workflow" button.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies (including dev deps for lint/test tools)
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies (including dev deps for lint/test tools)
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test